<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f47b20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Obrex Local — Controle de Obras</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obrex">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f4f4,#0b0b0b);--surface:light-dark(#fff,#151515);--surface2:light-dark(#eeeeee,#202020);--text:light-dark(#151515,#f5f5f5);--muted:light-dark(#666,#aaaaaa);--line:light-dark(#d7d7d7,#383838);--accent:#f47b20;--accent2:#c95d08;--danger:#c94747;--shadow:0 10px 28px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%;}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}.shell{max-width:1180px;padding-top:max(15px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px}.brand h1{font-size:21px;margin:0}.brand small{color:var(--muted)}.primary{background:var(--accent);color:#fff;padding:12px 17px;border-radius:10px;font-weight:700}.primary:hover{background:var(--accent2)}button,input,select,textarea{touch-action:manipulation}.upload{min-height:44px;display:flex;align-items:center}.outline,.filter,.primary{min-height:44px}.field input,.field select,.field textarea{min-height:44px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.stat strong{font-size:22px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.search{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);padding:11px 13px;border-radius:10px;color:var(--text)}.filters{display:flex;gap:8px}.filter{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.cardhead{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0 0 4px;font-size:17px}.muted{color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;line-height:1;padding:7px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;min-height:28px}.badge:not(.ok){color:var(--accent2);border-color:rgba(244,123,32,.45);background:rgba(244,123,32,.12)}.badge.ok{color:#d8660a}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.money div{background:var(--surface2);border-radius:10px;padding:11px}.money span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.money strong{font-size:15px}.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0 5px}.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.outline{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:650}.danger{color:var(--danger)}
.empty{text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px;padding:22px;border:1px solid var(--line)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog h2{margin:0;font-size:20px}.x{background:transparent;color:var(--muted);font-size:25px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);outline:none}.field textarea{min-height:82px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.section h3{font-size:15px;margin:0 0 12px}.payment{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.payment:last-child{border-bottom:0}.payment .left{display:flex;gap:10px;align-items:center}.clip{font-size:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-box{background:var(--surface2);border-radius:10px;padding:12px}.detail-box span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.receipt{font-size:12px;color:var(--accent2);margin-top:4px}.receipt-card{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.receipt-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:600px){.receipt-card{align-items:flex-start;flex-direction:column}.receipt-actions{width:100%}}.fileinput{display:none}.upload{display:inline-block;border:1px dashed var(--line);padding:10px 12px;border-radius:9px;color:var(--muted);cursor:pointer}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{max-width:none}.formgrid,.detail-grid{grid-template-columns:1fr}}@media(max-width:480px){.shell{padding:15px}.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top .primary{padding:10px 12px}.money{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><main class="shell">
<header class="top"><div class="brand"><div class="mark">O</div><div><h1>Obrex</h1><small>Controle interno de obras e recebimentos</small></div></div><div style="display:flex;gap:8px;align-items:center"><button id="installBtn" class="filter" style="display:none" onclick="installApp()">📲 Instalar</button><button class="primary" onclick="openNew()">+ Nova obra</button></div></header>
<section class="stats" id="stats"></section>
<div class="toolbar"><input id="search" class="search" placeholder="Buscar por cliente ou obra..." oninput="render()"><div class="filters"><select id="statusFilter" class="filter" onchange="render()"><option value="all">Todas as obras</option><option value="andamento">Em andamento</option><option value="concluida">Concluídas</option></select><button class="filter" onclick="openReceipts()">📎 Comprovantes</button><button class="filter" onclick="openBackup()">💾 Backup</button></div></div>
<section id="cards" class="grid"></section>
</main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Nova obra</h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const key='obrex_obras_v3';
const DB_NAME='ObrexLocalDB'; const DB_VERSION=2; let db=null;
function openDB(){return new Promise((resolve,reject)=>{if(db)return resolve(db);const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('app'))d.createObjectStore('app');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
async function dbGet(){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('app','readonly').objectStore('app').get('obras');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function dbSet(v){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('app','readwrite').objectStore('app').put(v,'obras');r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function fileSet(id,blob,name,type){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('files','readwrite').objectStore('files').put({blob,name,type},id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function fileGet(id){const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('files','readonly').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function fileDelete(id){if(!id)return;const d=await openDB();return new Promise((resolve,reject)=>{const r=d.transaction('files','readwrite').objectStore('files').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function persist(){try{await dbSet(obras);localStorage.setItem(key,JSON.stringify(obras.map(o=>({...o,pagamentos:o.pagamentos.map(p=>({...p,dataUrl:''}))}))));}catch(e){console.error(e)}}
async function requestPersistentStorage(){try{if(navigator.storage?.persist){const already=await navigator.storage.persisted();if(!already)await navigator.storage.persist();}}catch(e){}}
async function migrateLegacy(){let saved=null;try{saved=await dbGet()}catch(e){}if(saved)return saved;let legacy=null;try{legacy=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!legacy){try{legacy=JSON.parse(localStorage.getItem('obrex_obras_v2')||'null')}catch(e){}}if(!legacy)return null;for(const o of legacy){for(const p of (o.pagamentos||[])){if(p.dataUrl&&p.dataUrl.startsWith('data:')){try{const res=await fetch(p.dataUrl);const blob=await res.blob();const fid='file_'+p.id;await fileSet(fid,blob,p.fileName||'comprovante',blob.type);p.fileId=fid;p.fileType=blob.type;p.dataUrl='';}catch(e){}}}}await dbSet(legacy);return legacy}
async function initData(){try{const saved=await migrateLegacy();if(saved){obras=saved;await requestPersistentStorage();render();return}}catch(e){console.warn('Migração local:',e)}const legacy=JSON.parse(localStorage.getItem(key)||'null');obras=legacy||demo;await persist();await requestPersistentStorage();render()}
function save(){persist()}
const demo=[{id:1,cliente:'João da Silva',obra:'Instalação elétrica residencial',endereco:'Cascavel – PR',total:18500,progresso:70,status:'andamento',inicio:'2026-09-10',previsao:'2026-10-30',obs:'Instalação completa da parte elétrica da residência.',pagamentos:[{id:11,data:'2026-09-10',valor:5000,forma:'PIX',comprovante:'Comprovante enviado pelo cliente'},{id:12,data:'2026-09-20',valor:3000,forma:'PIX',comprovante:'Comprovante enviado pelo cliente'},{id:13,data:'2026-09-28',valor:3000,forma:'Transferência',comprovante:'Comprovante enviado pelo cliente'}],arquivos:[]},{id:2,cliente:'Maria Oliveira',obra:'Adequação elétrica comercial',endereco:'Cascavel – PR',total:12400,progresso:40,status:'andamento',inicio:'2026-09-18',previsao:'2026-11-05',obs:'',pagamentos:[{id:21,data:'2026-09-18',valor:4000,forma:'PIX',comprovante:'Comprovante anexado'}],arquivos:[]}];
let obras=demo; let current=null;
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0); const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'';
function save(){localStorage.setItem(key,JSON.stringify(obras))}
function received(o){return o.pagamentos.reduce((s,p)=>s+Number(p.valor||0),0)}
function pct(o){return o.total?Math.min(100,received(o)/o.total*100):0}
function render(){
 const q=document.getElementById('search').value.toLowerCase(); const f=document.getElementById('statusFilter').value;
 const filtered=obras.filter(o=>(f==='all'||o.status===f)&&((o.cliente+' '+o.obra+' '+o.endereco).toLowerCase().includes(q)));
 const total=obras.reduce((s,o)=>s+o.total,0), rec=obras.reduce((s,o)=>s+received(o),0), open=total-rec;
 document.getElementById('stats').innerHTML=`<div class="stat"><span>Total contratado</span><strong>${money(total)}</strong></div><div class="stat"><span>Total recebido</span><strong>${money(rec)}</strong></div><div class="stat"><span>Total a receber</span><strong>${money(open)}</strong></div><div class="stat"><span>Obras ativas</span><strong>${obras.filter(o=>o.status==='andamento').length}</strong></div>`;
 document.getElementById('cards').innerHTML=filtered.length?filtered.map(card).join(''):`<div class="empty" style="grid-column:1/-1">Nenhuma obra encontrada.<br><br><button class="primary" onclick="openNew()">Cadastrar primeira obra</button></div>`;
}
function card(o){const r=received(o), fp=pct(o), done=Math.round(o.progresso);return `<article class="card"><div class="cardhead"><div><h3>${esc(o.cliente)}</h3><div class="muted">${esc(o.obra)}</div><div class="muted">${esc(o.endereco||'Sem endereço')}</div></div><span class="badge ${o.status==='concluida'?'ok':''}">${o.status==='concluida'?'Concluída':'Em andamento'}</span></div><div class="money"><div><span>Valor total</span><strong>${money(o.total)}</strong></div><div><span>Recebido</span><strong>${money(r)}</strong></div><div><span>A receber</span><strong>${money(Math.max(0,o.total-r))}</strong></div></div><div class="progress-row"><span>Progresso financeiro</span><b>${fp.toFixed(1)}%</b></div><div class="bar"><i style="width:${fp}%"></i></div><div class="progress-row"><span>Progresso da obra</span><b>${done}%</b></div><div class="bar"><i style="width:${done}%"></i></div><div class="cardfoot"><span class="muted">${o.pagamentos.length} pagamento(s) · ${o.arquivos.length} anexo(s)</span><button class="outline" onclick="openDetail(${o.id})">Abrir obra →</button></div></article>`}
function openNew(){current=null;document.getElementById('modalTitle').textContent='Nova obra';document.getElementById('modalBody').innerHTML=formHtml();document.getElementById('modal').classList.add('show')}
function formHtml(o={}){return `<div class="formgrid"><div class="field"><label>Cliente *</label><input id="fCliente" value="${esc(o.cliente||'')}"></div><div class="field"><label>Valor contratado *</label><input id="fTotal" type="number" step="0.01" value="${o.total||''}"></div><div class="field full"><label>Descrição da obra *</label><input id="fObra" value="${esc(o.obra||'')}"></div><div class="field full"><label>Endereço</label><input id="fEndereco" value="${esc(o.endereco||'')}"></div><div class="field"><label>Data de início</label><input id="fInicio" type="date" value="${o.inicio||''}"></div><div class="field"><label>Previsão de término</label><input id="fPrevisao" type="date" value="${o.previsao||''}"></div><div class="field"><label>Progresso da obra: <b id="pval">${o.progresso||0}%</b></label><input id="fProg" type="range" min="0" max="100" value="${o.progresso||0}" oninput="pval.textContent=this.value+'%'" ></div><div class="field"><label>Status</label><select id="fStatus"><option value="andamento" ${o.status!=='concluida'?'selected':''}>Em andamento</option><option value="concluida" ${o.status==='concluida'?'selected':''}>Concluída</option></select></div><div class="field full"><label>Observações</label><textarea id="fObs">${esc(o.obs||'')}</textarea></div></div><div class="actions"><button class="outline" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveObra()">Salvar obra</button></div>`}
function saveObra(){const cliente=fCliente.value.trim(),obra=fObra.value.trim(),total=Number(fTotal.value);if(!cliente||!obra||!total){alert('Preencha cliente, descrição e valor contratado.');return}const data={id:current?.id||Date.now(),cliente,obra,endereco:fEndereco.value.trim(),total,progresso:Number(fProg.value),status:fStatus.value,inicio:fInicio.value,previsao:fPrevisao.value,obs:fObs.value,pagamentos:current?.pagamentos||[],arquivos:current?.arquivos||[]};if(current){obras=obras.map(x=>x.id===current.id?data:x)}else obras.unshift(data);save();closeModal();render()}
function openDetail(id){const o=obras.find(x=>x.id===id);current=o;document.getElementById('modalTitle').textContent=o.cliente+' — '+o.obra;const r=received(o),saldo=Math.max(0,o.total-r);document.getElementById('modalBody').innerHTML=`<div class="detail-grid"><div class="detail-box"><span>Valor contratado</span><strong>${money(o.total)}</strong></div><div class="detail-box"><span>Saldo a receber</span><strong>${money(saldo)}</strong></div><div class="detail-box"><span>Progresso financeiro</span><strong>${pct(o).toFixed(1)}%</strong></div><div class="detail-box"><span>Progresso da obra</span><strong>${o.progresso}%</strong></div></div><div class="section"><h3>Informações da obra</h3><div class="muted">${esc(o.endereco||'Sem endereço')} · Início: ${date(o.inicio)||'—'} · Previsão: ${date(o.previsao)||'—'}</div>${o.obs?`<p class="muted">${esc(o.obs)}</p>`:''}</div><div class="section"><h3>Registrar recebimento</h3><div class="formgrid"><div class="field"><label>Valor</label><input id="pValor" type="number" step="0.01" placeholder="0,00"></div><div class="field"><label>Data</label><input id="pData" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Forma de pagamento</label><select id="pForma"><option>PIX</option><option>Transferência</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>Outro</option></select></div><div class="field"><label>Comprovante</label><label class="upload"><input id="pFile" class="fileinput" type="file" accept="image/*,.pdf" onchange="fileName.textContent=this.files[0]?.name||'Selecionar comprovante'">📎 <span id="fileName">Selecionar comprovante</span></label></div></div><div class="actions"><button class="primary" onclick="addPayment(${o.id})">+ Registrar pagamento</button></div></div><div class="section"><h3>Histórico de pagamentos</h3>${o.pagamentos.length?o.pagamentos.slice().reverse().map(p=>`<div class="payment"><div class="left"><span class="clip">${p.dataUrl?'📎':'💰'}</span><div><b>${money(p.valor)}</b><div class="muted">${date(p.data)} · ${esc(p.forma)}</div>${p.fileName?`<div class="receipt">📎 ${esc(p.fileName)}</div>`:''}</div></div><div class="receipt-actions">${(p.fileId||p.dataUrl)?`<button class="outline" onclick="viewReceipt(${o.id},${p.id})">Abrir comprovante</button>`:''}<button class="outline danger" onclick="deletePayment(${o.id},${p.id})">Excluir</button></div></div>`).join(''):'<div class="muted">Nenhum pagamento registrado.</div>'}</div><div class="actions"><button class="outline" onclick="editObra(${o.id})">Editar obra</button><button class="outline danger" onclick="deleteObra(${o.id})">Excluir obra</button></div>`;document.getElementById('modal').classList.add('show')}
function editObra(id){const o=obras.find(x=>x.id===id);current=o;document.getElementById('modalTitle').textContent='Editar obra';document.getElementById('modalBody').innerHTML=formHtml(o)}
async function addPayment(id){const o=obras.find(x=>x.id===id), val=Number(pValor.value);if(!val||val<=0){alert('Informe um valor válido.');return}const file=pFile.files[0];const base={id:Date.now(),data:pData.value,valor:val,forma:pForma.value,fileName:file?.name||'',fileId:'',fileType:file?.type||'',dataUrl:''};if(file){const fid='file_'+base.id;await fileSet(fid,file,file.name,file.type);base.fileId=fid;}o.pagamentos.push(base);await persist();openDetail(id);render()}

function openReceipts(){
 const rows=[];
 obras.forEach(o=>o.pagamentos.forEach(p=>{if(p.dataUrl||p.fileName||p.comprovante) rows.push({o,p})}));
 rows.sort((a,b)=>(b.p.data||'').localeCompare(a.p.data||''));
 current=null; document.getElementById('modalTitle').textContent='Central de comprovantes';
 document.getElementById('modalBody').innerHTML=`<div class="toolbar"><input id="receiptSearch" class="search" placeholder="Buscar cliente, obra ou arquivo..." oninput="renderReceipts()"></div><div id="receiptsList"></div><div class="actions"><button class="outline" onclick="closeModal()">Fechar</button></div>`;
 document.getElementById('modal').classList.add('show'); window._receiptRows=rows; renderReceipts();
}
function renderReceipts(){
 const q=(document.getElementById('receiptSearch')?.value||'').toLowerCase();
 const rows=(window._receiptRows||[]).filter(({o,p})=>(o.cliente+' '+o.obra+' '+(p.fileName||'')+' '+p.forma).toLowerCase().includes(q));
 const el=document.getElementById('receiptsList'); if(!el)return;
 el.innerHTML=rows.length?rows.map(({o,p})=>`<div class="receipt-card"><div><b>${esc(o.cliente)}</b><div class="muted">${esc(o.obra)}</div><div class="muted">${date(p.data)} · ${esc(p.forma)} · <strong>${money(p.valor)}</strong></div>${p.fileName?`<div class="receipt">📎 ${esc(p.fileName)}</div>`:''}</div><div class="receipt-actions">${(p.fileId||p.dataUrl)?`<button class="outline" onclick="viewReceipt(${o.id},${p.id})">Abrir</button>`:'<span class="muted">Sem arquivo</span>'}<button class="outline" onclick="openDetail(${o.id})">Ver obra</button></div></div>`).join(''):'<div class="empty">Nenhum comprovante encontrado.</div>';
}
async function viewReceipt(oid,pid){
 const o=obras.find(x=>x.id===oid), p=o?.pagamentos.find(x=>x.id===pid);
 if(!p)return;
 let url='', revoke=false;
 try{
   if(p.fileId){
     const f=await fileGet(p.fileId);
     if(f?.blob){url=URL.createObjectURL(f.blob);revoke=true;}
   }else if(p.dataUrl){url=p.dataUrl;}
 }catch(e){console.error(e)}
 if(!url){alert('Comprovante não encontrado neste dispositivo.');return}
 const isPdf=(p.fileType||'').toLowerCase().includes('pdf')||/\.pdf$/i.test(p.fileName||'');
 const old=document.getElementById('obrexViewer'); if(old)old.remove();
 const viewer=document.createElement('div'); viewer.id='obrexViewer';
 viewer.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);display:flex;flex-direction:column;';
 const header=document.createElement('div');
 header.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#111;color:#fff;min-height:58px;';
 const title=document.createElement('div'); title.textContent=p.fileName||('Comprovante — '+o.cliente); title.style.cssText='font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
 const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:8px;flex-shrink:0;';
 const close=document.createElement('button'); close.textContent='Fechar'; close.style.cssText='border:0;border-radius:10px;padding:10px 14px;background:#f47b20;color:#111;font-weight:700;font-size:15px;';
 const open=document.createElement('a'); open.href=url; open.target='_blank'; open.rel='noopener'; open.textContent='Abrir'; open.style.cssText='text-decoration:none;border:1px solid #666;border-radius:10px;padding:9px 14px;color:#fff;font-weight:600;';
 actions.appendChild(open); actions.appendChild(close); header.appendChild(title); header.appendChild(actions);
 const body=document.createElement('div'); body.style.cssText='flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto;';
 if(isPdf){
   const frame=document.createElement('iframe'); frame.src=url; frame.title='Visualização do comprovante PDF'; frame.style.cssText='width:100%;height:100%;min-height:70vh;border:0;background:#fff;'; body.appendChild(frame);
 }else{
   const img=document.createElement('img'); img.src=url; img.alt='Comprovante de pagamento'; img.style.cssText='max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;'; body.appendChild(img);
 }
 viewer.appendChild(header); viewer.appendChild(body); document.body.appendChild(viewer);
 const cleanup=()=>{if(revoke)URL.revokeObjectURL(url);viewer.remove();};
 close.addEventListener('click',cleanup);
 viewer.addEventListener('click',e=>{if(e.target===viewer)cleanup();});
}
async function deletePayment(oid,pid){if(!confirm('Excluir este recebimento?'))return;const o=obras.find(x=>x.id===oid),p=o.pagamentos.find(x=>x.id===pid);if(p?.fileId)await fileDelete(p.fileId);o.pagamentos=o.pagamentos.filter(p=>p.id!==pid);await persist();openDetail(oid);render()}
async function deleteObra(id){if(!confirm('Excluir esta obra e seu histórico de pagamentos?'))return;const o=obras.find(x=>x.id===id);for(const p of (o?.pagamentos||[])){if(p.fileId)await fileDelete(p.fileId)}obras=obras.filter(x=>x.id!==id);await persist();closeModal();render()}
function openBackup(){document.getElementById('modalTitle').textContent='Backup dos dados';document.getElementById('modalBody').innerHTML=`<p class="muted">O Obrex salva os dados no armazenamento do navegador. Faça um backup periódico para não depender de um único dispositivo.</p><p id="storageInfo" class="muted">Verificando armazenamento…</p><div class="section"><h3>Exportar</h3><button class="primary" onclick="exportBackup()">⬇️ Baixar backup JSON</button></div><div class="section"><h3>Restaurar</h3><label class="upload"><input id="backupFile" class="fileinput" type="file" accept="application/json,.json" onchange="importBackup(this.files[0])">📂 Selecionar backup</label></div><div class="actions"><button class="outline" onclick="closeModal()">Fechar</button></div>`;document.getElementById('modal').classList.add('show')}
async function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function exportBackup(){const copy=JSON.parse(JSON.stringify(obras));for(const o of copy){for(const p of o.pagamentos||[]){if(p.fileId){const f=await fileGet(p.fileId);if(f?.blob){p.dataUrl=await blobToDataURL(f.blob);p.fileType=f.type||p.fileType||''}}}}const blob=new Blob([JSON.stringify({app:'Obrex',version:3,exportedAt:new Date().toISOString(),obras:copy},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='obrex-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.obras))throw new Error('Formato inválido');if(!confirm('Restaurar este backup substituirá os dados atuais. Continuar?'))return;obras=x.obras;for(const o of obras){for(const p of o.pagamentos||[]){if(p.dataUrl&&p.dataUrl.startsWith('data:')){const res=await fetch(p.dataUrl);const blob=await res.blob();const fid='file_'+p.id;await fileSet(fid,blob,p.fileName||'comprovante',p.fileType||blob.type);p.fileId=fid;p.dataUrl='';}}}await persist();closeModal();render();alert('Backup restaurado com sucesso.')}catch(e){console.error(e);alert('Não foi possível restaurar o backup.')}};r.readAsText(file)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
initData();

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block'});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'}
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
